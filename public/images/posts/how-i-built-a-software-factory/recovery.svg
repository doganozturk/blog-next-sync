<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Recovery after a run stops early</title>
  <desc id="desc">A run stops early because it failed, a runner restarted, or the owner cancelled it in GitHub Actions. The agent:run label and Project status stay. The permanent issue clone keeps local branches and unpushed commits. A job rerun or the hourly sweep starts the run again, and the agent continues from the existing branch, worktree, and pull requests.</desc>
  <rect width="1200" height="540" rx="28" fill="#f7f8f5"/>
  <text x="50" y="61" fill="#122236" font-family="Arial, sans-serif" font-size="32" font-weight="700">When a run stops early</text>
  <text x="50" y="93" fill="#536273" font-family="Arial, sans-serif" font-size="18">Cancellation in GitHub Actions is the stop button. The work stays in place.</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="50" y="155" width="300" height="106" rx="17" fill="#fff2df" stroke="#e3c995" stroke-width="2"/>
    <text x="200" y="199" fill="#8a5c19" font-size="22" font-weight="700">The run stops</text>
    <text x="200" y="230" fill="#536273" font-size="17">failed · restarted · cancelled</text>
    <rect x="450" y="155" width="300" height="106" rx="17" fill="#e9f0fc" stroke="#aec3e7" stroke-width="2"/>
    <text x="600" y="199" fill="#122236" font-size="22" font-weight="700">GitHub state stays</text>
    <text x="600" y="230" fill="#536273" font-size="17">label · status · open PRs</text>
    <rect x="850" y="155" width="300" height="106" rx="17" fill="#e9f0fc" stroke="#aec3e7" stroke-width="2"/>
    <text x="1000" y="199" fill="#122236" font-size="22" font-weight="700">Local work stays</text>
    <text x="1000" y="230" fill="#536273" font-size="17">permanent issue clone</text>
  </g>
  <g fill="none" stroke="#54709a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M363 208h73m-11-9 11 9-11 9"/>
    <path d="M763 208h73m-11-9 11 9-11 9"/>
    <path d="M1000 261v45H350v29"/>
    <path d="M572 387h206m-11-9 11 9-11 9"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="140" y="335" width="420" height="104" rx="17" fill="#e8f4ec" stroke="#a8d3b7" stroke-width="2"/>
    <text x="350" y="379" fill="#246b45" font-size="22" font-weight="700">Rerun or hourly sweep</text>
    <text x="350" y="410" fill="#536273" font-size="17">skips issues with a live job</text>
    <rect x="790" y="335" width="360" height="104" rx="17" fill="#e8f4ec" stroke="#a8d3b7" stroke-width="2"/>
    <text x="970" y="379" fill="#246b45" font-size="22" font-weight="700">Agent resumes</text>
    <text x="970" y="410" fill="#536273" font-size="17">same branch, worktree, and PRs</text>
  </g>
  <text x="50" y="490" fill="#536273" font-family="Arial, sans-serif" font-size="19" font-weight="700">Unpushed commits survive runner replacement because the clone lives outside the runner.</text>
</svg>

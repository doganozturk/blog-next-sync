<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">The software factory flow</title>
  <desc id="desc">The owner defines the problem, grills the idea with an agent, moves the issue to Todo, and adds the agent:run label. A GitHub Actions runner on the Mac Studio starts one coding agent. The agent implements the work, gets one round of read-only reviews from other model families, and publishes pull requests. PR Steward watches the pull requests until the quiet gate passes and writes the handoff. The owner reviews, squash-merges, and checks what the agent could not verify.</desc>
  <rect width="1200" height="740" rx="28" fill="#f7f8f5"/>
  <text x="50" y="62" fill="#122236" font-family="Arial, sans-serif" font-size="32" font-weight="700">From a conversation to a reviewed handoff</text>
  <text x="50" y="95" fill="#536273" font-family="Arial, sans-serif" font-size="18">GitHub holds the state; one label starts one run</text>
  <rect x="50" y="135" width="1100" height="150" rx="20" fill="#e9f0fc"/>
  <text x="76" y="169" fill="#254f91" font-family="Arial, sans-serif" font-size="18" font-weight="700">I decide</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="75" y="190" width="225" height="65" rx="12" fill="#ffffff" stroke="#aec3e7" stroke-width="2"/>
    <text x="187" y="230" fill="#122236" font-size="20" font-weight="700">Define the problem</text>
    <rect x="347" y="190" width="225" height="65" rx="12" fill="#ffffff" stroke="#aec3e7" stroke-width="2"/>
    <text x="459" y="230" fill="#122236" font-size="20" font-weight="700">Grill the idea</text>
    <rect x="619" y="190" width="225" height="65" rx="12" fill="#ffffff" stroke="#aec3e7" stroke-width="2"/>
    <text x="731" y="230" fill="#122236" font-size="20" font-weight="700">Move it to Todo</text>
    <rect x="891" y="190" width="225" height="65" rx="12" fill="#254f91"/>
    <text x="1003" y="230" fill="#ffffff" font-size="20" font-weight="700">agent:run</text>
  </g>
  <g fill="none" stroke="#54709a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 222h25m-9-8 9 8-9 8"/>
    <path d="M582 222h25m-9-8 9 8-9 8"/>
    <path d="M854 222h25m-9-8 9 8-9 8"/>
    <path d="M1003 255v45h-835v42" stroke-dasharray="6 7"/>
  </g>
  <rect x="50" y="315" width="1100" height="185" rx="20" fill="#e8f4ec"/>
  <text x="76" y="349" fill="#246b45" font-family="Arial, sans-serif" font-size="18" font-weight="700">One Agent Run delivers</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="75" y="373" width="186" height="88" rx="12" fill="#ffffff" stroke="#a8d3b7" stroke-width="2"/>
    <text x="168" y="408" fill="#122236" font-size="19" font-weight="700">Runner starts</text>
    <text x="168" y="434" fill="#536273" font-size="15">one coding agent</text>
    <rect x="291" y="373" width="186" height="88" rx="12" fill="#ffffff" stroke="#a8d3b7" stroke-width="2"/>
    <text x="384" y="408" fill="#122236" font-size="19" font-weight="700">Agent implements</text>
    <text x="384" y="434" fill="#536273" font-size="15">in its own worktree</text>
    <rect x="507" y="373" width="186" height="88" rx="12" fill="#ffffff" stroke="#a8d3b7" stroke-width="2"/>
    <text x="600" y="408" fill="#122236" font-size="19" font-weight="700">Other models</text>
    <text x="600" y="434" fill="#536273" font-size="15">review once, read-only</text>
    <rect x="723" y="373" width="186" height="88" rx="12" fill="#ffffff" stroke="#a8d3b7" stroke-width="2"/>
    <text x="816" y="408" fill="#122236" font-size="19" font-weight="700">Agent publishes</text>
    <text x="816" y="434" fill="#536273" font-size="15">the pull requests</text>
    <rect x="939" y="373" width="186" height="88" rx="12" fill="#246b45" stroke="#246b45" stroke-width="2"/>
    <text x="1032" y="408" fill="#ffffff" font-size="19" font-weight="700">PR Steward</text>
    <text x="1032" y="434" fill="#e8f4ec" font-size="15">watches, then hands off</text>
  </g>
  <g fill="none" stroke="#4b8460" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M265 417h18m-8-8 8 8-8 8"/>
    <path d="M481 417h18m-8-8 8 8-8 8"/>
    <path d="M697 417h18m-8-8 8 8-8 8"/>
    <path d="M913 417h18m-8-8 8 8-8 8"/>
    <path d="M1032 461v54h-860v42" stroke-dasharray="6 7"/>
  </g>
  <rect x="50" y="530" width="1100" height="150" rx="20" fill="#e9f0fc"/>
  <text x="76" y="564" fill="#254f91" font-family="Arial, sans-serif" font-size="18" font-weight="700">I accept</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="75" y="585" width="225" height="65" rx="12" fill="#ffffff" stroke="#aec3e7" stroke-width="2"/>
    <text x="187" y="625" fill="#122236" font-size="20" font-weight="700">Review the PRs</text>
    <rect x="347" y="585" width="225" height="65" rx="12" fill="#ffffff" stroke="#aec3e7" stroke-width="2"/>
    <text x="459" y="625" fill="#122236" font-size="20" font-weight="700">Squash-merge</text>
    <rect x="619" y="585" width="225" height="65" rx="12" fill="#ffffff" stroke="#aec3e7" stroke-width="2"/>
    <text x="731" y="625" fill="#122236" font-size="20" font-weight="700">Check the rest</text>
  </g>
  <g fill="none" stroke="#54709a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 617h25m-9-8 9 8-9 8"/>
    <path d="M582 617h25m-9-8 9 8-9 8"/>
  </g>
  <text x="891" y="612" fill="#536273" font-family="Arial, sans-serif" font-size="16">Feedback? I add the label</text>
  <text x="891" y="636" fill="#536273" font-family="Arial, sans-serif" font-size="16">again, and the run resumes.</text>
  <text x="50" y="715" fill="#536273" font-family="Arial, sans-serif" font-size="16">"Check the rest" means what the agent could not verify by itself.</text>
</svg>
